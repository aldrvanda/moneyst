<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money'st - Transaction</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Righteous:wght@400&family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navigation -->
    <div class="navbar">
        <div class="logo">
            <img src="assets/images/logo.jpg" alt="logo">
        </div>
        <nav class="nav-menu" aria-label="Main">
            <a href="home.html" class="nav-btn">Home</a>
            <a href="transaction.html" class="nav-btn" aria-current="page">Transaction</a>
            <a href="savings.html" class="nav-btn">Savings</a>
            <a href="help.html" class="nav-btn">Help</a>
            <a href="Contact.html" class="nav-btn">Contact Us</a>
        </nav>
        <a href="SignUp.html" class="btn-SignUp" aria-label="Account">
                <img src="assets/images/profile.png" alt="">
            </a>
    </div>

    <div class="transaction-container">
         <div class="top-transaction">
            <!-- Financial Summary -->
            <section class="financial-summary">
                <div class="summary-card">
                    <div class="summary-item1">
                        <p class="label">Your current balance</p>
                        <h2 class="amount" id="tx-balance">Rp 5.400.000</h2>
                    </div>
                    <div class="divider"></div>
                    <div class="summary-item2">
                        <p class="financial-state">Financial State</p>
                        <h2 class="financial-status" id="tx-status">Good! Keep it up!</h2>
                    </div>
                </div>
            </section>

            <!-- Expense Categories -->
            <section class="expense-categories-transaction">
                <h2>Expense Category</h2>

                <div class="date-selector-transaction2">
                    <input type="month" id="tx-category-month" value="2025-03" aria-label="Month for expense categories">
                </div>

                <div class="pie-chart-transaction" id="tx-donut"></div>
            </section>
        </div>

        <!-- Income & Expenses Chart -->
        <section class="bar-chart-section-transaction">
            <div class="bar-chart-header-transaction">
                <h2>Income & Expenses</h2>
                <a href="financeRecord.html" class="see-more">See more...</a>
            </div>
                
            <div class="date-selector-transaction">
                <input type="month" id="tx-flow-month" value="2025-03" aria-label="Month for income and expenses">
            </div>

            <div class="bar-img-transaction" id="tx-bars"></div>

            <div class="chart-summary">
                <div class="summary-item income-summary">
                    <span class="label">Income</span>
                    <span class="value" id="tx-income">Rp 2.080.000</span>
                </div>

                <div class="chart-divider"></div>

                <div class="summary-item expense-summary">
                    <span class="label">Expenses</span>
                    <span class="value" id="tx-expense">Rp 1.140.000</span>
                </div>
            </div>
        </section>

        <!-- Action Buttons -->
        <div class="action-buttons-transaction horizontal">
            <a href="addIncome.html" class="action-btn income-btn">Add New Income</a>
            <a href="addExpense.html" class="action-btn expense-btn">Add New Expense</a>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/pages.js"></script>
</body>
</html>
