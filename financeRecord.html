<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money'st - Finance Record</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link href='https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css2?family=Righteous&display=swap' rel='stylesheet'>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navigation -->
    <div class="navbar">
        <div class="logo">
            <img src="assets/images/logo.jpg" alt="logo">
        </div>
        <nav class="nav-menu" aria-label="Main">
            <a href="home.html" class="nav-btn">Home</a>
            <a href="transaction.html" class="nav-btn" aria-current="page">Transaction</a>
            <a href="savings.html" class="nav-btn">Savings</a>
            <a href="help.html" class="nav-btn">Help</a>
            <a href="Contact.html" class="nav-btn">Contact Us</a>
        </nav>
        <a href="SignUp.html" class="btn-SignUp" aria-label="Account">
                <img src="assets/images/profile.png" alt="">
            </a>
    </div>

    <!-- Main Content -->
    <div class="main-content-record">
        <!-- Header Title -->
        <div class="header-title-record">
            Your Overall Finance Record
        </div>

        <!-- Finance Cards Container -->
        <div class="finance-container-record">
            <!-- Income Card -->
            <div class="finance-card income-card">
                <h2 class="card-title">Income</h2>
                
                <!-- Period Toggle -->
                <div class="period-toggle">
                    <input type="radio" id="income-monthly" name="income-period" value="monthly" checked>
                    <label for="income-monthly">Monthly</label>
                    
                    <input type="radio" id="income-weekly" name="income-period" value="weekly">
                    <label for="income-weekly">Weekly</label>
                    
                    <input type="radio" id="income-daily" name="income-period" value="daily">
                    <label for="income-daily">Daily</label>
                </div>

                <!-- Income Items -->
                <div class="finance-items" id="income-items"></div>

                <!-- Add Button -->
                <a href="addIncome.html" class="add-btn" aria-label="Add new income" title="Add new income">+</a>

                <!-- Total -->
                <div class="total-section">
                    <div class="total-label">Total:</div>
                    <div class="total-amount" id="income-total">Rp 5.400.000</div>
                </div>
            </div>

            <!-- Expense Card -->
            <div class="finance-card expense-card">
                <h2 class="card-title">Expense</h2>
                
                <!-- Period Toggle -->
                <div class="period-toggle">
                    <input type="radio" id="expense-monthly" name="expense-period" value="monthly" checked>
                    <label for="expense-monthly">Monthly</label>
                    
                    <input type="radio" id="expense-weekly" name="expense-period" value="weekly">
                    <label for="expense-weekly">Weekly</label>
                    
                    <input type="radio" id="expense-daily" name="expense-period" value="daily">
                    <label for="expense-daily">Daily</label>
                </div>

                <!-- Expense Items -->
                <div class="finance-items" id="expense-items"></div>

                <!-- Add Button -->
                <a href="addExpense.html" class="add-btn" aria-label="Add new expense" title="Add new expense">+</a>

                <!-- Total -->
                <div class="total-section">
                    <div class="total-label">Total:</div>
                    <div class="total-amount" id="expense-total">Rp 5.400.000</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
