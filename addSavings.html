<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money'st - Add Savings</title>
    <link rel="stylesheet" href="style2.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href='https://fonts.googleapis.com/css?family=Righteous' rel='stylesheet'>
</head>
<body>
    <!-- Navigation -->
    <div class="navbar">
        <div class="logo">
            <img src="DASHBOARD PAGE/logo.jpg" alt="logo">
        </div>
        <nav class="nav-menu">
            <a href="home.html" class="nav-btn">Home</a>
            <a href="transaction.html" class="nav-btn">Transaction</a>
            <a href="savings.html" class="nav-btn">Savings</a>
            <a href="help.html" class="nav-btn">Help</a>
            <a href="Contact.html" class="nav-btn">Contact Us</a>
            <a href="SignUp.html" class="btn-SignUp">
                <img src="DASHBOARD PAGE/profile.png" alt="Profile Icon">
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-container-addSave">
        <div class="content-wrapper-addSave">
            <!-- Left Section - Saving Goals Form -->
            <div class="left-section-addSave">
                <div class="section-header-addSave">
                    <h2>Saving Goals</h2>
                </div>
                <div class="form-container-addSave">
                    <form id="savingsForm-addSave">
                        <div class="input-group-addSave">
                            <label for="savingsName">Enter Your Savings Name</label>
                            <input type="text" id="savingsName" name="savingsName" required>
                        </div>

                        <div class="input-group-addSave">
                            <label for="savingsDescription">Enter Saving Description</label>
                            <input type="text" id="savingsDescription" name="savingsDescription" required>
                        </div>

                        <div class="input-group-addSave">
                            <label for="savingsGoal">Enter Your Savings Goals</label>
                            <input type="number" id="savingsGoal" name="savingsGoal" required>
                        </div>

                        <div class="input-group-addSave">
                            <label for="savingsPeriod">Enter The Savings Period</label>
                            <div class="date-input-container">
                                <input type="date" id="savingsPeriod" name="savingsPeriod" required>
                            </div>
                        </div>

                        <button type="submit" class="save-btn">Save Saving</button>
                    </form>
                </div>
            </div>

            <!-- Right Section - Other Savings -->
            <div class="right-section-addSave">
                <div class="section-header-addSave2">
                    <h2>Other Savings</h2>
                </div>
                
                <!-- Gaming Console Card -->
                <div class="savings-card-addSave">
                    <h3>Next Gen Gaming Console</h3>
                    <div class="progress-container-addSave">
                        <div class="progress-bar-addSave-console">
                            <img src="S1P8/fill console.png" class="fill-console">
                        </div>
                    </div>
                    <p class="progress-text-addSave">You Reach 15% of Your Savings Target</p>
                    <div class="amount-range">
                       <img src="S1P8/progress gaming console.png" class="progress-console">
                    </div>
                    <a href="viewSavings.html" class="view-details-btn">View Details</a>
                </div>

                <!-- Gaming PC Card -->
                <div class="savings-card-addSave">
                    <h3>Gaming PC</h3>
                    <div class="progress-container-addSave">
                        <div class="progress-bar-addSave-pc">
                            <img src="S1P8/fill pc.png" class="fill-pc">
                        </div>
                    </div>
                    <p class="progress-text-addSave">You Reach 35% of Your Savings Target</p>
                    <div class="amount-range">
                        <img src="S1P8/progress gaming pc.png" class="progress-pc">
                    </div>
                    <a href="viewSavings.html" class="view-details-btn">View Details</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification-addSave" class="notification hidden">
        <div class="notification-content-addSave">
            <span class="notification-icon-addSave">✓</span>
        </div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
