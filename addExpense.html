<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money'st - Add Expense</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Righteous:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="add-expense-container">
       <!-- Navigation -->
        <div class="navbar">
            <div class="logo">
            <img src="assets/images/logo.jpg" alt="logo">
        </div>
        <nav class="nav-menu" aria-label="Main">
            <a href="home.html" class="nav-btn">Home</a>
            <a href="transaction.html" class="nav-btn" aria-current="page">Transaction</a>
            <a href="savings.html" class="nav-btn">Savings</a>
            <a href="help.html" class="nav-btn">Help</a>
            <a href="Contact.html" class="nav-btn">Contact Us</a>
        </nav>
        <a href="SignUp.html" class="btn-SignUp" aria-label="Account">
                <img src="assets/images/profile.png" alt="">
            </a>
    </div>
     
        <!-- Form Section -->
        <section class="form-section-add">
            <div class="form-title-add">
                <h1>New Expense</h1>
            </div>
             
            <div class="form-container-add">
                <form id="expenseForm" class="expense-form">
                    <div class="form-group-add">
                        <label for="amount">How Much?</label>
                        <div class="amount-input-container">
                            <div class="currency-label">IDR</div>
                            <div class="amount-input">
                                <span class="currency-symbol">Rp</span>
                                <input type="text" id="amount" name="amount" placeholder="50,000" inputmode="numeric">
                            </div>
                        </div>
                    </div>
                     
                    <div class="form-group-add">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                     
                    <div class="form-group-add">
                        <label for="category">Category</label>
                        <div class="dropdown-container">
                            <select id="category" name="category" required>
                                <option value="">Select Category</option>
                                <option value="food">🍽️ Food</option>
                                <option value="transport">🚗 Transport</option>
                                <option value="shopping">🛍️ Shopping</option>
                                <option value="entertainment">🎬 Entertainment</option>
                                <option value="bills">📄 Bills</option>
                                <option value="health">🏥 Health</option>
                                <option value="education">📚 Education</option>
                                <option value="travel">✈️ Travel</option>
                                <option value="other">📦 Other</option>
                            </select>
                            <div class="dropdown-arrow">
                                <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
                                    <path d="M1 1L6 6L11 1" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                     
                    <div class="form-actions-add">
                        <button type="submit" class="save-btn">Save</button>
                        <button type="button" class="cancel-btn" onclick="window.location.href='transaction.html'">Cancel</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
     
    <!-- Notification -->
    <div id="notification-addExp" class="notification-addExp">
        <span id="notificationText-addExp"></span>
    </div>
      
    <!-- Loading Overlay -->
    <div id="loadingOverlay-addExp" class="loading-overlay-addExp">
        <div class="loading-spinner-addExp">
            <div class="spinner-addExp"></div>
            <p>Saving your expense...</p>
        </div>
    </div>
     
    <script src="js/data.js"></script>
    <script src="js/script3.js"></script>
</body>
</html>
