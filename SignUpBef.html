<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money'st - Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Righteous' rel='stylesheet'>
</head>
<body>

    <!-- Navigation -->
    <div class="navbar">
        <div class="logo">
            <img src="DASHBOARD PAGE/logo.jpg" alt="logo">
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="helpBef.html" class="nav-btn">Help</a>
            <a href="ContactBef.html" class="nav-btn">Contact Us</a>
            <a href="SignUpBef.html" class="btn-SignUp">
                <img src="DASHBOARD PAGE/profile.png" alt="Profile Icon">
            </a>
        </nav>
    </div>

    <!-- Sign Up Page Layout -->
    <div class="SignUp-container">
        <!-- Left Side - Form -->
        <div class="SignUp-form-section">
            <div class="SignUp-header">
                <h1>Sign Up</h1>
            </div>

            <div class="form-container-SignUp">
                <form id="SignUpForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Masukkan email" required>
                    </div>

                    <div class="form-group password-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                        </div>
                        <div class="password-hint">
                            <small>Password minimal 8 karakter</small>
                        </div>
                    </div>

                    <button type="submit" class="signup-btn">Sign Up</button>

                    <div class="login-link">
                        <p>Already have an account? <a href="loginBef.html">Login</a></p>
                    </div>
                </form>
            </div>

            <div class="footer-section">
                <div class="social-SignUp">
                    <div class="social-btn"><img src="LOGIN PAGE/facebook.png" alt="Facebook"></div>
                    <div class="social-btn"><img src="LOGIN PAGE/google.png" alt="Google"></div>
                    <div class="social-btn"><img src="LOGIN PAGE/apple.png" alt="apple"></div>
                </div>
            </div>
        </div>

        <!-- Right Side - Image -->
        <div class="SignUp-image-section">
            <img src="LOGIN PAGE/LOGIN.png" class="SignUp-visual">
        </div>
    </div>

    <!-- Notification -->
    <div id="notification-SignUp" class="notification">
        <span id="notificationText"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
