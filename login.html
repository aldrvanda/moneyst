<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money'st - Login</title>
    <link rel="stylesheet" href="css/style2.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Righteous' rel='stylesheet'>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Navigation -->
    <div class="navbar">
        <div class="logo">
            <img src="assets/images/logo.jpg" alt="logo">
        </div>
        <nav class="nav-menu" aria-label="Main">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="helpBef.html" class="nav-btn">Help</a>
            <a href="ContactBef.html" class="nav-btn">Contact Us</a>
        </nav>
        <a href="SignUpBef.html" class="btn-SignUp" aria-label="Account">
                <img src="assets/images/profile.png" alt="">
            </a>
    </div>

    <!-- Login Page Layout -->
    <div class="Login-container">
        <!-- Left Side - Form -->
        <div class="Login-form-section">
            <div class="Login-header">
                <h1>Login</h1>
            </div>

            <div class="form-container-Login">
                <form id="LoginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group password-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Login</button>

                    <div class="signup-link">
                        <p>Don't have an account? <a href="SignUp.html">Sign Up</a></p>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Side - Image -->
        <div class="Login-image-section">
            <img src="assets/images/login-illustration.png" class="Login-visual">
        </div>
    </div>

    <!-- Notification -->
    <div id="notification-Login" class="notification">
        <span id="notificationText"></span>
    </div>

    <script src="js/script3.js"></script>
</body>
</html>
